[workspace]
members = [
    "apps/renderer-demo",
    "apps/terrain-demo",
    "crates/foundation-runtime",
    "crates/point-contracts",
    "crates/point-index",
    "crates/point-terrain",
    "crates/point-workspace",
    "crates/point-source",
    "crates/point-view",
    "crates/render-protocol",
    "crates/render-wgpu",
    "crates/source-las",
    "crates/source-memory",
]
resolver = "3"

[workspace.package]
version = "0.10.0-alpha.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xxibcill/punctra"

[workspace.dependencies]
allocation-counter = "=0.8.1"
blake3 = "1.8.6"
bytemuck = { version = "1.25.2", features = ["derive"] }
criterion = "0.7.0"
delaunator = "=1.1.0"
foundation-runtime = { path = "crates/foundation-runtime" }
getrandom = "0.3.4"
glam = "0.33.3"
las = { version = "=0.10.0", features = ["laz"] }
laz = "=0.12.2"
libm = "0.2.16"
pollster = "1.0.1"
quick-xml = "=0.41.0"
point-contracts = { path = "crates/point-contracts" }
point-index = { path = "crates/point-index" }
point-terrain = { path = "crates/point-terrain" }
point-workspace = { path = "crates/point-workspace" }
point-source = { path = "crates/point-source" }
point-view = { path = "crates/point-view" }
render-protocol = { path = "crates/render-protocol" }
render-wgpu = { path = "crates/render-wgpu" }
robust = "=1.2.0"
roxmltree = "=0.21.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
source-las = { path = "crates/source-las" }
source-memory = { path = "crates/source-memory" }
tempfile = "=3.24.0"
thiserror = "2.0.20"
wgpu = "30.0.0"
winit = "0.30.13"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
