[package]
name = "point-terrain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic terrain derivation, persistence, QA, and exchange for Punctra"
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/point-terrain"
publish = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[features]
default = []

[dependencies]
blake3.workspace = true
foundation-runtime.workspace = true
point-contracts.workspace = true
point-workspace.workspace = true
robust.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[dev-dependencies]
allocation-counter.workspace = true
criterion.workspace = true
delaunator.workspace = true
point-index.workspace = true
roxmltree.workspace = true
serde_json.workspace = true
source-memory = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[[bench]]
name = "terrain"
harness = false
