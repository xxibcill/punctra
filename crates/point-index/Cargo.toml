[package]
name = "point-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic persistent spatial index for verified Punctra Sources"
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/point-index"
publish = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[features]
default = []

[dependencies]
blake3.workspace = true
foundation-runtime.workspace = true
getrandom.workspace = true
point-contracts.workspace = true
point-source.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[dev-dependencies]
allocation-counter.workspace = true
criterion.workspace = true
serde_json = "=1.0.151"
source-memory = { workspace = true, features = ["test-support"] }

[[bench]]
name = "index"
harness = false

[lints]
workspace = true
