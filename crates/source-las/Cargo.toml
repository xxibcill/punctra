[package]
name = "source-las"
description = "Verified bounded LAS and LAZ Source adapter for Punctra."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/source-las"
publish = true
autoexamples = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[features]
default = []

[dependencies]
blake3.workspace = true
foundation-runtime.workspace = true
las.workspace = true
laz.workspace = true
point-contracts.workspace = true
point-source.workspace = true
tempfile.workspace = true

[dev-dependencies]
allocation-counter.workspace = true
criterion.workspace = true
serde_json = "1.0.151"
source-memory.workspace = true

[[bench]]
name = "read"
harness = false

[[example]]
name = "inspect"
path = "examples/inspect.rs"

[[example]]
name = "generate_las_v1_fixtures"
path = "examples/generate_v1_fixtures.rs"

[lints]
workspace = true
