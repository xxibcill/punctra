name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

  gpu-software:
    runs-on: ubuntu-24.04
    env:
      PUNCTRA_REQUIRE_GPU: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Install software Vulkan adapter
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers vulkan-tools
      - name: Select software Vulkan adapter
        run: |
          lavapipe_manifest="$(dpkg-query --listfiles mesa-vulkan-drivers | sed -n '/\/lvp_icd.*\.json$/ { p; q; }')"
          if [[ -z "$lavapipe_manifest" ]]; then
            echo "Mesa Lavapipe ICD manifest was not installed" >&2
            exit 1
          fi
          printf 'VK_DRIVER_FILES=%s\n' "$lavapipe_manifest" >> "$GITHUB_ENV"
      - name: Verify software Vulkan adapter
        run: vulkaninfo --summary
      - name: Run GPU acceptance tests
        run: cargo test -p render-wgpu --test offscreen -- --nocapture --test-threads=1
