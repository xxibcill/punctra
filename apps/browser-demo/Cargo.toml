[package]
name = "browser-demo"
description = "WebAssembly/WebGPU host packaged by the Punctra browser SDK."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
point-view.workspace = true
render-protocol.workspace = true
render-wgpu.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wgpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement", "Navigator", "Window"] }
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
las.workspace = true
point-contracts.workspace = true
point-index.workspace = true
point-source.workspace = true
sha2.workspace = true
source-las.workspace = true

[lints]
workspace = true
