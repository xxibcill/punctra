[package]
name = "browser-demo"
description = "Private local WebAssembly/WebGPU browser acceptance host for Punctra."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
point-view.workspace = true
render-protocol.workspace = true
render-wgpu.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wgpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement", "Navigator", "Window"] }

[lints]
workspace = true
